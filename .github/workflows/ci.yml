name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  qml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The QML modules are installed by pattern: neither qml-qt6 nor
      # qml6-module-qtquick pulls in what QtQuick and QtQuick.Effects import.
      - name: Install the Qt QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools qml-qt6 \
            '^qml6-module-qtqml' '^qml6-module-qtquick'

      # Quickshell and omarchy-shell are not installed, so qmllint cannot
      # resolve their imports and its exit code varies by build. A [syntax]
      # diagnostic is the failure that ships: the lock would not load.
      - name: Lint QML
        run: |
          shopt -s globstar nullglob
          files=(omarchy/**/*.qml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no QML found - the glob has gone stale" >&2
            exit 1
          fi
          set +e
          out=$(/usr/lib/qt6/bin/qmllint "${files[@]}" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -eq 126 || $status -eq 127 ]]; then
            echo "::error::qmllint could not be run (exit $status)"
            exit 1
          fi
          if grep -q '\[syntax\]' <<<"$out"; then
            echo "::error::QML syntax error - see the [syntax] diagnostics above"
            exit 1
          fi

      - name: Drive the lock view
        run: tests/qml/run.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck omarchy/arzaroth.veil/bin/snapshot omarchy/arzaroth.veil/poster.sh scripts/*.sh tests/**/*.sh

      - name: Snapshot helper
        run: tests/snapshot/run.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shellcheck the coverage script
        run: shellcheck scripts/coverage.sh

      - name: Line coverage floor
        run: scripts/coverage.sh --check
